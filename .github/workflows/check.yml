name: Readiness checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        vscode: ['1.141.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - name: Reproduce interrupted entry
        run: |
          for crw_attempt in {1..100}; do
            pnpm exec vitest run tests/committed-source.test.ts -t 'entry interruption before checkout' > /tmp/crw22-repro.log 2>&1 || { cat /tmp/crw22-repro.log; exit 1; }
            if (( crw_attempt % 10 == 0 )); then echo "Passed $crw_attempt interrupted-entry attempts"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-${{ matrix.os }}-${{ matrix.vscode }}
          include-hidden-files: true
          path: |
            /tmp/crw22-repro.log
            .host-test/evidence.json
            dist/*.vsix
          if-no-files-found: warn
