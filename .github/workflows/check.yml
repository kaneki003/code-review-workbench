name: Readiness checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        vscode: ['1.141.2']
        lane: [1, 2, 3, 4, 5, 6]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - name: Reproduce Windows request failure
        shell: bash
        run: |
          for crw_attempt in {1..2}; do
            pnpm exec vitest run tests/committed-source.test.ts -t 'entry pins an otherwise|interrupted Active publication' > crw22-repro.log 2>&1 || { cat crw22-repro.log; exit 1; }
            echo "Passed Windows probe $crw_attempt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-${{ matrix.os }}-${{ matrix.vscode }}-${{ matrix.lane }}
          include-hidden-files: true
          path: |
            crw22-repro.log
            .host-test/evidence.json
            dist/*.vsix
          if-no-files-found: warn
